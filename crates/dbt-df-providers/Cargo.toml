[package]
name = "dbt-df-providers"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
dbt-vfs = { workspace = true }
dbt-adapter-core = { workspace = true }
dbt-csv = { workspace = true }
dbt-frontend-common = { workspace = true }
dbt-schema-store = { workspace = true }

arrow = { workspace = true, features = ["json"] }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true, features = ["parquet"] }
datafusion-catalog = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
futures = { workspace = true }
parquet = { workspace = true, features = ["async"] }
scc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "process", "rt-multi-thread", "signal"] }

[dev-dependencies]
# DataFusion 51+ put SessionContext::sql behind the `sql` feature; only the
# tests issue SQL.
datafusion = { workspace = true, features = ["parquet", "sql"] }
