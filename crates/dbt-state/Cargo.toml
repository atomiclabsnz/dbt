[package]
name = "dbt-state"
version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "dbt_state"
path = "src/mod.rs"


[dependencies]
dbt-adapter = { workspace = true }
dbt-cloud-config = { workspace = true }
dbt-common = { workspace = true }
dbt-frontend-common = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
dbt-jinja-utils = { workspace = true }
dbt-parser = { workspace = true }
dbt-platform-auth = { workspace = true }
dbt-profile = { workspace = true }
dbt-schemas = { workspace = true }
dbt-telemetry = { workspace = true }
dbt-yaml = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crossbeam-queue = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
jsonwebtoken = { workspace = true }
md5 = { workspace = true }
minijinja = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
dbt-adapter-core = { workspace = true }
dbt-tasks-sa = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"

# ferrion-wasm: the Redis task cache (redis + GCP IAM auth via gcloud-auth),
# the system browser opener and tonic's HTTP/2 transport are native only. On
# wasm the task cache is the no-op one and the dbt State gRPC client refuses
# to connect, which every caller already treats as "service disabled".
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcloud-auth = { workspace = true }
open = { workspace = true }
redis = { workspace = true }
token-source = { workspace = true }
tonic = { workspace = true, features = ["codegen", "router", "transport", "tls-native-roots"] }
tokio = { workspace = true, features = ["fs", "net", "process", "rt-multi-thread", "signal"] }
