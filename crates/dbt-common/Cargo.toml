[package]
name = "dbt-common"
version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
keywords.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
dbt-adapter-core = { workspace = true }
dbt-error = { workspace = true }
dbt-frontend-common = { workspace = true }
dbt-telemetry = { workspace = true }
dbt-tracing = { workspace = true }
# leaf dependencies (depend on little more than std lib)
blake3 = { workspace = true }
dbt-base = { workspace = true }
hex = { workspace = true }
md5 = { workspace = true }
once_cell = { workspace = true }

clap = { workspace = true, features = ["derive", "env"] }
indexmap = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

chrono = { workspace = true }
console = { workspace = true }
dashmap = { workspace = true }
dbt-yaml = { workspace = true }
dialoguer = { workspace = true }
humantime = { workspace = true }
minijinja = { workspace = true }
scc = { workspace = true }

schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

arc-swap = { workspace = true }
tokio = { workspace = true }

normalize-path = { workspace = true }
pathdiff = { workspace = true }

dbt-tui-progress = { workspace = true }
rust-embed = { workspace = true }

dirs = { workspace = true }

sha2 = { workspace = true }

# Tracing
proto-rust = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

dbt-fusion-workspace-hack = { version = "0.1" }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
powershell_script = "1.1.0"

[dev-dependencies]
bytes = { workspace = true }
dbt-telemetry = { workspace = true, features = ["test-utils"] }
dbt-test-primitives = { workspace = true }
dbt-tracing = { workspace = true, features = ["test-utils"] }
indoc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
name = "dbt_common"
path = "src/mod.rs"
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "process", "rt-multi-thread", "signal"] }

# ferrion-wasm: the browser has no OS entropy source. Every getrandom major in
# the graph needs its JS backend selected (0.3/0.4 also need
# `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS). These deps exist only to
# turn the feature on; dbt-common does not call them.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
